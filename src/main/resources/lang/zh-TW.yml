  cleanupFailed: "§e清理交易紀錄失敗"
  cleanupDone: "§b已清理 §a${0} §b筆過期的交易紀錄"
  legacyPending: "§b尚有 §a${0} §b筆舊名稱帳戶待同名玩家登入取回"
  # ${0}=舊帳戶名稱 ${1}=玩家 ${2}=各貨幣餘額
  legacyClaimed: "§b舊帳戶 §a${0} §b已併入 §a${1}§b：${2}"
  legacyHeldBalance: "§e舊帳戶 §a${0} §e未併入 §a${1}§e：已有餘額"
  legacyHeldConflict: "§e舊帳戶 §a${0} §e未併入 §a${1}§e：名稱衝突"
  profilesUnavailable: "§e無法連上 tokaProfiles：§a${0}"
  drainTimeout: "§e關閉時等待寫入逾時（10 秒），部分變更可能未存檔"
  reloaded: "§b已重新載入設定：§a${0} §b種貨幣"
  commandSkipped: "§e指令 /${0} 已由 ${1} 使用，略過註冊"

# ───────────────────────── 狀態文字（status） ─────────────────────────
# status.reason.<代碼>：交易紀錄的原因；其他插件自訂的原因代碼找不到時直接顯示代碼。
status:
  system: "系統"
  reason:
    transfer: "轉帳"
    fee: "手續費"
    exchange-out: "兌換轉出"
    exchange-in: "兌換轉入"
    initial: "起始餘額"
    give: "給予"
    take: "扣除"
    set: "設定"
    api: "其他插件"
    legacy-claim: "舊帳戶併入"

plan:
  missing: '已要求啟用 Plan，但 Plan 尚未就緒；/${0} plan mode auto 可改為自動偵測。'
  detected: '已偵測到 Plan，目前模式 ${0}；/${1} plan status 可查看設定。'
  configureFailed: 'Plan 設定未完成：${0}。'
  noPermission: '§c沒有管理 Plan 展示的權限。'
  configured: '§aPlan 設定已儲存；/${0} plan status 可查看。'
  usage: '§e/${0} plan status | mode <auto|enable|disable> | fields <all|none|欄位...>'
  account: '已有經濟帳戶'
  balance: '${0} 餘額'
  ready: 'Plan 經濟資訊整合已啟用。'
  unsupported: 'Plan 缺少 DataExtension Builder API，已略過經濟資訊整合。'
  unavailable: 'Plan 經濟資訊整合暫時不可用：${0}'
