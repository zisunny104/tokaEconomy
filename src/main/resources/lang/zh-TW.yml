# tokaEconomy 繁體中文語系檔（zh-TW）
#
# 插件所有「使用者看得到的文字」都在這裡。伺服器擁有者可把同名檔放進
# plugins/tokaEconomy/lang/zh-TW.yml 覆蓋個別文字，沒寫到的 key 仍使用內建內容。
# 貨幣名稱不在這裡，而是寫在 config.yml 的 currencies.<代碼>.names。
#
# 參數：${0}、${1}… 依序代表程式傳入的值。
# 色碼：§b 一般文字　§a 數字與名稱　§e 指令與警告　§c 錯誤　§7 次要說明　§6 標題　§r 重設
# 後台 log 不加方括號標籤；玩家訊息固定使用前綴 ui.prefix。

# ───────────────────────── 用法（cmd） ─────────────────────────
cmd:
  balance:
    usage: "/balance [玩家] [貨幣]"
  pay:
    usage: "/pay <玩家> <金額> [貨幣]"
  exchange:
    usage: "/exchange <來源貨幣> <目標貨幣> <金額>"
  economy:
    usage: "/economy <top|see|give|take|set|reload|vacuum|ledger|rates|legacy|menu|plan|help>"
    legacy:
      usage: "/economy legacy <list [頁]|claim <名稱> <玩家>|drop <名稱>>"
    give:
      usage: "/economy give <玩家> <金額> [貨幣]"
    take:
      usage: "/economy take <玩家> <金額> [貨幣]"
    set:
      usage: "/economy set <玩家> <金額> [貨幣]"

# ───────────────────────── 說明（help） ─────────────────────────
# 每份清單的第一行是標題，其餘行會分頁。
help:
  balance:
    - "§6=== §f§l/balance 查看餘額§r §6==="
    - "§e/balance §7- §b開啟錢包視窗：餘額、轉帳、兌換、排行榜、交易紀錄"
    - "§e/balance <玩家> [貨幣] §7- §b以文字查看餘額，看其他玩家需要 tokaEconomy.see"
    - "§e/balance help §7- §b顯示此說明"
  pay:
    - "§6=== §f§l/pay 轉帳§r §6==="
    - "§e/pay <玩家> <金額> [貨幣] §7- §b轉帳給玩家，不寫貨幣時使用主要貨幣"
    - "§7手續費由轉出方在金額之外另付，規則見 config.yml 的 fee 與 fee-rules"
    - "§e/pay help §7- §b顯示此說明"
  exchange:
    - "§6=== §f§l/exchange 兌換§r §6==="
    - "§e/exchange §7- §b列出可用的匯率"
    - "§e/exchange <來源貨幣> <目標貨幣> <金額> §7- §b依匯率兌換，所得無條件捨去為整數"
    - "§e/exchange help §7- §b顯示此說明"
  economy:
    - "§6=== §f§l經濟指令說明§r §6=== §7（<必填>、[選填]）"
    - "§e/balance [玩家] [貨幣] §7- §b查看餘額"
    - "§e/pay <玩家> <金額> [貨幣] §7- §b轉帳給玩家"
    - "§e/exchange <來源貨幣> <目標貨幣> <金額> §7- §b兌換貨幣"
    - "§e/economy top [貨幣] [頁] §7- §b排行榜"
    - "§b查看與紀錄（管理員）："
    - "§e/economy see [玩家] [貨幣] §7- §b查看餘額，看他人需要 tokaEconomy.see"
    - "§e/economy ledger [玩家] [頁] §7- §b查詢交易紀錄"
    - "§e/economy rates §7- §b列出匯率"
    - "§e/economy menu §7- §b開啟管理視窗"
    - "§b調整餘額（管理員）："
    - "§e/economy give <玩家> <金額> [貨幣] §7- §b給予"
    - "§e/economy take <玩家> <金額> [貨幣] §7- §b扣除"
    - "§e/economy set <玩家> <金額> [貨幣] §7- §b設定餘額"
    - "§b維護（管理員）："
    - "§e/economy reload §7- §b重新讀取 config.yml 與語系檔"
    - "§e/economy vacuum §7- §b立即清理過期的交易紀錄"
    - "§b舊名稱帳戶（管理員）："
    - "§e/economy legacy list [頁] §7- §b列出尚未取回的舊名稱帳戶"
    - "§e/economy legacy claim <名稱> <玩家> §7- §b強制把舊帳戶餘額併入玩家帳戶（會寫交易紀錄）"
    - "§e/economy legacy drop <名稱> §7- §b刪除一筆舊帳戶，不給任何人"
    - "§b Plan 展示（管理員）："
    - "§e/economy plan status §7- §b查看 Plan 展示設定"
    - "§e/economy plan mode <auto|enable|disable> §7- §b設定 Plan 展示模式"
    - "§e/economy plan fields <all|none|欄位...> §7- §b設定要展示的欄位（account、balance.<貨幣>）"
    - "§b相容指令（config.yml 的 compat-commands 開啟時）："
    - "§7/bal /money /topmoney /seemoney /givemoney /takemoney /setmoney"

# ───────────────────────── 訊息（msg） ─────────────────────────
msg:
  balance:
    self: "§6=== §f§l你的餘額§r §6==="
    other: "§6=== §f§l${0} 的餘額§r §6==="
    line: "§b${0}：§a${1}"
  pay:
    sent: "§b已轉給 §a${1}§b：§a${0}§b，餘額 §a${3}"
    sentFee: "§b已轉給 §a${1}§b：§a${0}§b，手續費 §a${2}§b，餘額 §a${3}"
    received: "§a${1}§b 轉給你 §a${0}"
  exchange:
    none: "§b目前沒有設定可兌換的匯率"
    done: "§b已用 §a${0}§b 兌換 §a${1}§b，餘額 §a${2}§b、§a${3}"
  admin:
    give: "§b已給予 §a${0}§b：§a${1}§b，餘額 §a${2}"
    take: "§b已扣除 §a${0}§b：§a${1}§b，餘額 §a${2}"
    set: "§b已設定 §a${0}§b 的餘額為 §a${1}"
  ledger:
    header: "§6=== §f§l交易紀錄§r §6=== §7共 ${0} 筆"
    line: "§7${0} §b${1} §7→ §b${2} §a${3} §7${4}（${5}）"
    empty: "§b沒有交易紀錄"
  rates:
    header: "§6=== §f§l匯率§r §6==="
    line: "§b1 ${0} = §a${2}§b ${1}"
  top:
    header: "§6=== §f§l${0}排行榜§r §6==="
    line: "§7${0}. §b${1} §a${2}"
    empty: "§b還沒有人持有這種貨幣"
  reload:
    ok: "§a已重新載入設定"
  window:
    cancelled: "§b已取消"
  legacy:
    header: "§6=== §f§l舊名稱帳戶§r §6=== §7共 ${0} 筆"
    # ${0}=名稱 ${1}=各貨幣餘額 ${2}=來源
    line: "§a${0} §7- §b${1} §7（${2}）"
    empty: "§b沒有尚未取回的舊名稱帳戶"
    # ${0}=各貨幣餘額；同名玩家登入時自動併入
    joined: "§b已併入舊帳戶餘額：§a${0}"
    # ${0}=舊帳戶名稱 ${1}=玩家 ${2}=各貨幣餘額
    claimed: "§b已把舊帳戶 §a${0}§b 併入 §a${1}§b：§a${2}"
    dropped: "§b已刪除舊帳戶 §a${0}"
  vacuum:
    started: "§b開始清理交易紀錄"
    done: "§b已清理 §a${0}§b 筆交易紀錄"

# ───────────────────────── 錯誤（err） ─────────────────────────
err:
  playerOnly: "§c這個指令只能由遊戲內玩家使用"
  noPermission: "§c你沒有權限使用這個指令"
  noSee: "§c只有管理員能查看其他玩家的餘額"
  usage: "§c用法：§e${0}"
  player:
    notFound: "§c找不到玩家 §a${0}"
  noAccount: "§c${0} 沒有帳戶"
  amount: "§c金額必須是大於 0 的整數"
  currency: "§c沒有 §a${0}§c 這種貨幣，可用：§a${1}"
  insufficient: "§c餘額不足，需要 §a${0}§c，目前 §a${1}"
  overflow: "§c金額過大，餘額無法容納"
  self: "§c不能轉給自己"
  noRate: "§c沒有 §a${0}§c 的匯率"
  unavailable: "§c經濟服務目前無法使用"
  reload: "§c設定無效，沿用原設定：${0}"
  vacuum: "§c清理失敗，詳見後台 log"
  legacy:
    notFound: "§c沒有名為 §a${0}§c 的舊名稱帳戶"
    name: "§c名稱不能是空的、超過 100 字或含控制字元"

# ───────────────────────── 介面（ui） ─────────────────────────
# 玩家視窗（/balance）。標題與按鈕文字都在這裡；${n} 為程式帶入的值。
ui:
  prefix: "§7[經濟]§r "
  page:
    footer: "§7第 §a${0}§7/§a${1}§7 頁，用 §e${2} <頁碼>§7 換頁"
    # 分頁視窗的標題。${0}=原標題 ${1}=頁碼 ${2}=總頁數
    title: "${0} (${1}/${2})"
  # tokaDisplay 側欄的餘額列。key 是貨幣代碼，沒有對應 key 的貨幣使用 other。${0}=貨幣名稱 ${1}=千分位餘額
  sidebar:
    money: "§b[${0}]${1}§r"
    coin: "§e[${0}]${1}§r"
    other: "§a[${0}]${1}§r"
  common:
    cancel: "§c取消"
  button:
    back: "返回"
    prevPage: "上一頁"
    nextPage: "下一頁"
    options: "搜尋／排序／每頁數量"
    close: "§c關閉"
    transfer: "轉帳"
    exchange: "兌換貨幣"
    top: "排行榜"
    ledger: "交易紀錄"
  # 清單的搜尋、排序、每頁數量視窗（清單項目多時才出現）。${0}=清單全部項目數
  options:
    title: "清單選項"
    hint: "共 ${0} 項，關鍵字留空表示不篩選。"
    query: "搜尋關鍵字"
    queryHint: "輸入文字的一部分"
    sort: "排序方式"
    sortDefault: "預設順序"
    sortName: "依文字"
    perPage: "每頁顯示幾項"
  # ${0}=關鍵字
  search:
    none: "沒有含有「${0}」的項目，可按最下方選項重新搜尋"
  # 錢包主視窗。${0}=各貨幣餘額（每行一種）
  balance:
    title: "我的錢包"
    prompt: "${0}"
  transfer:
    players:
      title: "轉帳對象"
      hint: ""
      empty: "現在沒有其他線上玩家可以轉帳；對方離線時請用 /pay"
    form:
      # ${0}=對象名稱
      title: "轉帳給 ${0}"
      label: "轉帳給 ${0}，手續費另計，確認前會顯示"
      amount: "金額（整數）"
      amountHint: "例如 1000"
      currency: "貨幣"
    confirm:
      title: "確認轉帳"
      # ${0}=對象 ${1}=金額 ${2}=手續費 ${3}=實付合計 ${4}=轉帳後餘額
      content: "對象：${0}
金額：${1}
手續費：${2}
實付合計：${3}
轉帳後餘額：${4}"
      accept: "確認轉帳"
    offline:
      item: "輸入離線玩家名稱"
      title: "離線玩家"
      label: "輸入對方的玩家名稱"
      name: "玩家名稱"
      nameHint: "例如 Steve"
  exchange:
    pairs:
      title: "兌換貨幣"
      hint: ""
      empty: "目前沒有可兌換的匯率"
    # ${0}=來源貨幣 ${1}=目標貨幣 ${2}=匯率
    pair: "${0} → ${1}  （1 : ${2}）"
    form:
      title: "兌換貨幣"
      # ${0}=來源貨幣 ${1}=目標貨幣 ${2}=匯率 ${3}=來源貨幣餘額
      label: "${0} → ${1}，匯率 1 : ${2}
目前持有 ${3}
所得無條件捨去為整數"
      # ${0}=來源貨幣
      amount: "要兌換的 ${0} 數量（整數）"
      amountHint: "例如 1000"
    confirm:
      title: "確認兌換"
      # ${0}=付出 ${1}=可得 ${2}=兌換後來源貨幣餘額
      content: "付出：${0}
可得：${1}
兌換後餘額：${2}"
      accept: "確認兌換"
  top:
    currencies:
      title: "排行榜"
      prompt: ""
    list:
      # ${0}=貨幣名稱
      title: "${0}排行榜"
      # ${0}=你的名次
      hint: "你的名次：${0}"
      empty: "還沒有人持有這種貨幣"
    # 清單項目：${0}=名稱 ${1}=金額 ${2}=名次
    row: "${0} ${1} 第 ${2} 名"
    self: "${0} ${1} 第 ${2} 名（你）"
    rank: "第 ${0} 名"
    unranked: "未上榜"
  ledger:
    title: "交易紀錄"
    # ${0}=筆數
    hint: "最近 ${0} 筆（只列出與你有關的）"
    empty: "還沒有交易紀錄"
    sortNew: "新到舊"
    sortOld: "舊到新"
    # 清單項目：${0}=時間 ${1}=原因 ${2}=金額 ${3}=對方。排序用交易紀錄的時間與編號，與文字無關。
    out: "${0} ${1} -${2} → ${3}"
    in: "${0} ${1} +${2} ← ${3}"

  admin:
    title: "經濟管理"
    prompt: ""
    button:
      adjust: "調整餘額"
      see: "查看餘額"
      ledger: "玩家交易紀錄"
      rates: "匯率"
      reload: "重新載入設定"
    kind:
      give: "給予"
      take: "扣除"
      set: "設定為"
    pick:
      title: "選擇玩家"
      hint: "搜尋可縮小線上名單；離線玩家請直接輸入名稱"
      search: "搜尋線上玩家"
      searchHint: "名稱的一部分"
      online: "線上玩家"
      none: "（不選）"
      offline: "離線玩家名稱"
      offlineHint: "有填寫時優先使用"
      missing: "§c請選擇或輸入一位玩家"
    adjust:
      # ${0}=玩家
      title: "調整 ${0}"
      label: "對象：${0}"
      action: "動作"
      currency: "貨幣"
      amount: "金額（整數）"
      amountHint: "例如 1000"
    confirm:
      title: "確認調整"
      # ${0}=動作 ${1}=玩家 ${2}=金額
      content: "動作：${0}
對象：${1}
金額：${2}"
      accept: "確認"
    ledger:
      # ${0}=玩家
      title: "${0} 的交易紀錄"
    rates:
      title: "匯率"
    reload:
      title: "重新載入"
      content: "要重新讀取 config.yml 與語系檔嗎？"
      accept: "重新載入"

# ───────────────────────── 後台 log（log） ─────────────────────────
